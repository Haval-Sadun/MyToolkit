name: Pack and publish to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "MyToolkit/**"
  workflow_dispatch: # lets a workflow-only change (like this one) be re-run manually

jobs:
  pack-and-publish:
    # MyToolkit.csproj targets Android, iOS, and Mac Catalyst — the iOS/Mac Catalyst workloads
    # need a real Xcode toolchain to install at all, which only exists on a macOS runner.
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Windows isn't in this list on purpose — MyToolkit.csproj only adds that TFM when
      # $([MSBuild]::IsOSPlatform('windows')) is true, so it's already excluded here.
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst

      - name: Pack
        run: dotnet pack MyToolkit/MyToolkit.csproj -c Release -o ./nupkgs

      # --skip-duplicate makes this a no-op (not a failure) when this exact <Version> was already
      # published — so not every push has to bump the version to succeed.
      - name: Push to GitHub Packages
        env:
          NUGET_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/Haval-Sadun/index.json" \
            --api-key "$NUGET_TOKEN" \
            --skip-duplicate
